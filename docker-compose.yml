services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weightlifting_tracker
      POSTGRES_USER: weightlifting
      POSTGRES_PASSWORD: weightlifting
    ports:
      - "5432:5432"
    volumes:
      - weightlifting_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weightlifting -d weightlifting_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weightlifting_postgres:

